name: anki_classroom_frontend
description: Anki Classroom - A collaborative flashcard learning platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for backend API communication
  http: ^1.2.0

  # State management
  provider: ^6.1.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Searchable dropdown
  dropdown_search: ^7.0.0

  # HTML rendering for card content
  flutter_html: ^3.0.0-beta.2

  # shadcn-style UI components
  shadcn_flutter: ^0.0.53

  # Material Design icons (extended set)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
