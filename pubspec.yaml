name: anki_classroom_frontend
description: Anki Classroom - A collaborative flashcard learning platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for backend API communication
  http: ^1.2.0

  # State management
  provider: ^6.1.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Searchable dropdown
  dropdown_search: ^7.0.0

  # WebView for rendering Anki card HTML (Android/iOS)
  webview_flutter: ^4.14.1

  # HTML rendering fallback for desktop/web (webview_flutter unsupported there)
  flutter_html: ^3.0.0-beta.2

  # shadcn-style UI components
  shadcn_flutter: ^0.0.53

  # Routing
  go_router: ^14.0.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Material Design icons (extended set)
  cupertino_icons: ^1.0.8

  # Code editor for HTML template editing
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # Lucide icons
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
